<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idiomas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .checkbox {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 24px;
            max-width: 700px;
        }

        .checkbox > label:first-child {
            font-weight: 600;
            margin-right: 12px;
        }

        #soloOficialLabel {
            font-weight: normal;
            color: #555;
        }

        #radioIdiomas {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        #radioIdiomas .radio-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            padding: 3px 10px;
            font-size: 0.875rem;
            cursor: pointer;
            background: #fff;
        }

        #radioIdiomas .radio-btn input[type="radio"] {
            margin: 0;
        }

        #badge-filtro {
            display: inline-block;
            background: #e9ecef;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.85rem;
            color: #333;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            max-width: 750px;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead tr {
            border-bottom: 2px solid #000;
        }

        thead th {
            padding: 8px 12px;
            font-weight: 700;
            text-align: left;
        }

        thead th:nth-child(3),
        thead th:nth-child(4) {
            text-align: right;
        }

        tbody tr {
            border-bottom: 1px solid #dee2e6;
        }

        tbody td {
            padding: 7px 12px;
        }

        tbody td:nth-child(3),
        tbody td:nth-child(4) {
            text-align: right;
        }

        #poblacion_total {
            display: block;
            font-weight: normal;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

<h1 class="mb-4" style="font-size:1.2rem;">Miriam Jiménez Sánchez - Países de la Unión Europea</h1>

<div class="checkbox">
    <label>Elige un idioma: </label>
    <label id="soloOficialLabel">
        <input type="checkbox" name="idiomaOficial" id="idiomaOficial">
        Solo idiomas oficiales
    </label>
    <div id="radioIdiomas"></div>
</div>

<span id="badge-filtro"></span>

<table>
    <thead>
    <tr>
        <th>País</th>
        <th>Capital</th>
        <th>Población<span id="poblacion_total"></span></th>
        <th>Fecha adhesión</th>
    </tr>
    </thead>
    <tbody id="cuerpoTabla"></tbody>
</table>

<script type="module" src="MJ_script.js"></script>
</body>
</html>
